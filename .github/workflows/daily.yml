name: Daily Weather Podcast

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = 北京时间次日 05:00（早上那集）
    - cron: "30 3 * * *"   # UTC 03:30 = 北京时间当日 11:30（中午那集）
    - cron: "0 9 * * *"    # UTC 09:00 = 北京时间当日 17:00（傍晚那集）
  workflow_dispatch:        # 支持手动点按钮立即运行一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate episode
        env:
          BASE_URL: https://farrah-yoto.github.io/yoto-weather
          # 手动点 Run workflow 时强制重新生成，定时运行则跳过已存在的
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Weather $(date -u +%F)"
          git push
